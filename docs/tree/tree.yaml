# 目的・要件・タスクの木（第 3 弾、2026-10-24、総監督）
# 形と欄の意味は同じ場所の README.md。第 1 弾・第 2 弾に Argon の事前の評価を受けた。第 3 弾は第 2 弾の条件 4 つを取り込んだ版
# 第 2 弾の形：節は objective と requirement だけ。depends_on は要件どうしだけ。タスクは要件の tasks に台帳の ID を 1 か所だけ書く。
# タスクどうしの順は台帳の depends_on が持つ。台帳に無い案は proposals に書く。

objective:
  id: objective
  # 1 行で書く（>- で折ると、行の継ぎ目に空白が入り、「作り、 3D」のようになる。台帳の project_goal と同じ文字列にする）
  title: 人の手を借りずに、計測しながら自己改善し続けられる開発ハーネスとゲーム生成パイプラインを作り、3D の物理演算を含むゲームを題材にした長期開発で、単一コンテキスト型のエージェントと統制された比較実験を行い、優劣を判定する（ハーネス側が勝つことは完了の条件にしない）
  source: >-
    docs/progress.yaml の project_goal（操縦士の文、game-harness#284）を標準の語彙で言い直した。
    第 2 弾で Argon の案を取り込んだ。ただし「計測と回帰ベンチマークを通じて」は「計測しながら」に戻した
    （回帰ベンチマークで改善を検出できるかは req.benchmark-sensitivity の仮説で、最終目的で決めない）。
    操縦士がこの文で確定した（2026-10-24、副操縦士の知らせ）。Git に入れるときに台帳の project_goal もこの文に直す
  depends_on: [req.self-improvement, req.measurable, req.comparison-valid, req.harness-healthy]

requirements:

# ---- 最終目的のすぐ下 ----

- id: req.self-improvement
  title: 自己改善のサイクルが続けて回る
  achieved_when: >-
    ハーネスが自分の計測から改善のタスクを起こし、実装し、点を下げずに取り込むサイクルが、
    人の手を挟まずに続けて回っている（回数の決め方は req.measurable が満たされてから決める）
  verify_by: [reviewer, human]
  status: 未達
  depends_on:
  - req.measurable
  - req.harness-healthy
  - req.planner-capability-known
  - req.turn-cutoff-reduced
  - req.agents-md-effect
  - req.operator-proposals-placed
  - req.failure-attribution
  tasks: [W-61, W-25, W-94]
  evidence:
  - report.md 00:58 の版：改善サイクルの回数 0/4。W-61・W-25・W-94 は止めた

- id: req.measurable
  title: 改善が点を下げたかを、走り直しの揺れと区別して判定できる
  achieved_when: >-
    点を決めるもの（仕様・判定役・非公開のテスト・固定の計画・実装のモデルと版・試行の回数・取り込み前の自動検査・環境）が記録で固定され、
    変えたら基準を取り直す決まりが機械で守られている。基準の値が、今のパイプラインで取り直されている
  verify_by: [test:independent, reviewer]
  status: 未達
  depends_on: [req.baseline-retaken, req.benchmark-sensitivity, req.gemini-quota]
  evidence:
  - 引継ぎの A14（roadmap D-128）：点を決めるものを変えたら基準を取り直す
  - 引継ぎの A16：今の基準 102/110（N=1）は、立て直しでパイプラインが変わるので、そのままは使えない

- id: req.comparison-valid
  title: 単一コンテキスト型との比較が、統制された実験として判定になる
  achieved_when: >-
    両方が満点に張り付かない規模の題材があり、事前に登録した規約（docs/bench/protocol.md）のもとで、勝ち負けのどちらも実験の結論になる
  verify_by: [reviewer, human]
  status: 未達
  depends_on: [req.self-improvement, req.measurable, req.task-scale, req.physics-engine]
  evidence:
  - 11 本目 §2a。比較の規約は W-68 で置いた（docs/bench/protocol.md）

- id: req.harness-healthy
  title: ハーネスが健全で、上の 3 つに進むのを妨げる欠陥と無駄が無い
  achieved_when: >-
    1 本の課題が、承認から判定の合格まで人の手を挟まずに通り、その記録を読んだレビュアーが「欠陥と無駄に妨げられていない」と判じている。
    臨時にプランナーとワーカーを兼ねている席が閉じている。そのうえで操縦士がループの再開を決めている
  verify_by: [reviewer, human]
  status: 未達
  depends_on:
  - req.end-to-end-run
  - req.verify-independent
  - req.protected-checks
  - req.risk-tiers
  - req.runner-isolated
  - req.env-contained
  - req.wiring-executed
  - req.no-waste
  - req.planner-tools
  - req.roles-separated
  - req.tree-in-git
  - req.progress-reviewed
  tasks: [W-168]
  evidence:
  - docs/design/adr-004.md §1（欠陥 5 つでループを止めた）
  - docs/rebuild/README.md §3 の P0〜P12

# ---- ハーネスが健全：欠陥（adr-004 §1）と配線 ----

- id: req.verify-independent
  title: すべてのコード変更で、合否が実装した者以外の検証で決まる
  achieved_when: >-
    機能の追加に限らず、ハーネスの改修を含むすべてのコード変更のタスクで、受入テストはプランナーが実装の前に別の PR で入れている。
    テストのファイル（tests/** と受入テストの置き場）を保護パスにし、CI が PR の触れたパスだけで機械的に決める（コミットの名義は偽れるので見ない）：
    (1) テストのファイルとそれ以外を同じ PR で変えたら落とす。
    (2) テストのファイルだけの PR で、新しいファイルを足すだけのものは中リスク（レビュアーの差分の監査で通る。足したテストは縛りを強めるだけで、弱められない）。
    (3) 既存のテストのファイルを変える・消す PR は高リスク（req.risk-tiers。単独の PR で人の承認）。
    差分の意味は、レビュアーが監査している
  verify_by: [test:independent, reviewer]
  status: 未達
  depends_on: [req.protected-checks]
  tasks: [W-134, W-132, W-135]
  proposals:
  - CI の検査：上の (1)〜(3) を、PR の変えたパスの一覧から決める段
  evidence:
  - Argon の批評（第 2 弾）の 4：コミットの名義は偽れる。保護パスで担保する
  - (2) と (3) は PR の中身で決まり、誰が出したかに依らない。誰が承認したかを区別するところだけが req.protected-checks（AI 用のアカウント）に依る
  - adr-004.md §1 の 1：合否は影響テストの終了コードと人のラベル 1 枚だけ
  - adr-004.md §1 の 2：テストの出どころを書いた 71 件中 63 件（88.7%）が実装した者自身（from self）

- id: req.protected-checks
  title: 検査のコード・CI の定義・権限の設定を、ワーカーが変えられない
  achieved_when: >-
    main にブランチ保護があり、保護パス（CI のワークフロー・合否を決めるスクリプト・常駐ワーカー・権限の設定・既存のテスト）を変える PR は、
    人のアカウントの承認なしにはマージできない。承認の検査が、人と AI のアカウントを区別できる
  verify_by: [test:independent, human]
  status: 未達
  depends_on: []
  proposals:
  - （人間）main のブランチ保護と保護パスを設定する（取り下げた W-130・W-131 の中身）
  - （人間）AI 用の GitHub アカウントを分け、承認の検査が人と区別できるようにする
  evidence:
  - adr-004.md §1 の 3
  - .github/scripts/ms4_approval_gate.py:18：ラベルを最後に付けた者が承認者の一覧に居るかだけを見る。実行役は操縦士のアカウントで付ける（11 本目 §2c）

- id: req.risk-tiers
  title: 変更がリスクの層で分かれ、高リスクの変更は単独の PR で人が短く判断できる
  achieved_when: >-
    PR が、触れたパスから機械で低・中・高の層に分かれる。高リスク（CI のワークフロー・合否を決めるスクリプト・常駐ワーカー・権限・既存のテストの変更と削除）は、
    ほかの変更と束ねた PR では CI が落ちる。高リスクの PR の本文に 5 行の要約（変更の要旨と理由・高リスクの理由・検証テストの書き手・副作用と配線の到達・レビュアーの批評）がある。
    人の承認なしの自動マージは低リスクだけで、req.protected-checks が満たされてから始める
  verify_by: [test:independent, human]
  status: 未達
  depends_on: [req.protected-checks, req.wiring-executed]
  tasks: [W-154]
  proposals:
  - 層を触れたパスから決める検査と、高リスクを束ねた PR を落とす CI の段
  evidence:
  - 語彙と再建の資料（review\vocabulary_and_architecture_rebuild.md）§4 の 1
  - W-154（操縦士が毎回受け取るもの）は、5 行の要約の形に絞って直す

- id: req.runner-isolated
  title: 常駐ワーカーが Git の管理下にあり、人の作業コピーから隔離され、例外で黙って止まらない
  achieved_when: >-
    常駐ワーカーのスクリプトがリポジトリにあり、テストがある。人の作業コピー（C:\src\game-harness）に触れない場所だけで動く。
    例外で止まったら report.md に出る
  verify_by: [test:independent, reviewer]
  status: 未達
  depends_on: []
  proposals:
  - 常駐ワーカー（run_night_loop.ps1）を Git に入れて隔離する（副操縦士が手順 2 で着手。取り下げた W-129 の中身。高リスクで単独の PR）
  evidence:
  - adr-004.md §1 の 4
  - 10-23 に走らせ役が人の作業コピーを checkout --detach して壊した（W-147 の一覧の 4）
  - 452 回続けて落ちた（副操縦士の資料 §2。出どころは未確認）

- id: req.env-contained
  title: 環境と版の直書きが境界の中に集まり、増えない
  achieved_when: >-
    外部の命令の名前・文字コードの手当て・OS に固有の処理が、決めた境界のモジュールの外に無い。増えたら CI が落ちる
  verify_by: [test:independent]
  status: 自己検証のみ
  depends_on: []
  tasks: [W-125, W-126]
  proposals:
  - UTF-8 の共通の強制（PR #298。台帳の ID は未確認）
  evidence:
  - adr-004.md §1 の 5：外部の命令の名前の直書き 46 ファイル 247 か所、文字コードの個別の手当て 56 ファイル 104 か所、OS 固有 17 ファイル 59 か所
  - W-125（増やせない歯止め）・W-126（環境の台帳）は済み。減らすことは済んでいない

- id: req.wiring-executed
  title: 本線の入口から実際に実行されないモジュールが、理由付きの許しの一覧の外に無い
  achieved_when: >-
    CI が、入口（python -m で起こすモジュールの一覧）ごとのスモークテストを、カバレッジを取りながら走らせ、
    harness/ の各モジュールに実行された行があることを確かめる。実行されないモジュールがあれば落とす。
    import の連鎖での到達の検査は、速い一次のふるいとしてだけ使う（トップレベルに import を 1 行書けば通るので、合否にはしない）。
    許しの一覧には理由と、数の上限がある
  verify_by: [test:independent, reviewer]
  status: 未達
  depends_on: []
  proposals:
  - 配線の検査の CI（手順 2。台帳の ID は未確認）。合否は入口のスモークのカバレッジで決める
  evidence:
  - コミット 1b207e0 の文：検査の部品 hline_red・hline_tdd は、最初から呼び出しが無かった（GitHub の API を要約で読んだ）
  - Argon の批評（第 1 弾）：import の到達だけでは、トップレベルに 1 行書けばすり抜ける
  - 静的な呼び出しのグラフでなくスモークのカバレッジにした理由：Python の動的な呼び出し（設定から名前で引く道具など）を静的な解析では辿りきれず、誤って落とす

# ---- ハーネスが健全：無駄 ----

- id: req.no-waste
  title: トークン・人の待ち時間・AI の作業時間に、目的に照らした無駄が無い
  achieved_when: >-
    下の各要件が満たされ、手順とデータを目的に照らしたレビュアーの評価で、除けるのに残っている無駄が挙がらない
  verify_by: [reviewer]
  status: 未達
  depends_on: [req.ci-fast, req.ledger-light, req.unconverged-capped, req.no-human-relay]
  tasks: [W-161, W-162]
  evidence:
  - docs/rebuild/README.md §2「無駄が無いこと」、P10・P11

- id: req.ci-fast
  title: PR ごとの CI の待ちが、動いていない部品のテストで延びていない
  achieved_when: 必須の CI から休眠のゲームのラインを外し、前と後の秒が PR に出ている
  verify_by: [test:independent]
  status: 自己検証のみ
  depends_on: []
  tasks: [W-136]
  evidence:
  - PR #297 がマージ済み（副操縦士の知らせ。秒の前後は総監督は未確認）。W-136 のうち部品を外す残りは、この要件の外（req.no-waste のレビュアーの評価で判じる）

- id: req.ledger-light
  title: 現役の台帳を読む量が、済んだタスクの分だけ膨らんでいない
  achieved_when: >-
    済んだタスクが別のファイルにあり、report.md の目的までの距離・関門ごとの流れ・進捗ツリーが分ける前と同じ文字列で、
    2 つを合わせた項目の集合が分ける前と同じ。現役の台帳を 1 回読むトークンの前後が PR に出ている
  verify_by: [test:independent]
  status: 検証済み
  depends_on: []
  tasks: [W-176, W-177]
  proposals:
  - >-
    過去ログが読めないときの例外の受け方をそろえる。hline_ledger_entry.base_state は「読めなければ ValueError」の約束なのに ProgressError が抜ける。
    hline_report.progress_report と hline_ledger_entry.on_integration は例外がそのまま上がる。ループを再開する前に、呼び手がどう扱うかを決めて試験で縛る（reply-architect-20261024-30.md §3）
  evidence:
  - 台帳 3,546 行（副操縦士の知らせ。README P11 では 3,545 行、済み 166 件）
  - >-
    W-176（PR #299）で実装済み（副操縦士の知らせ）。「検証済み」にしないのは、試験を書いたのが実装した者（ワーカー）で、
    総監督は PR の実物も、上の 3 つの条件（report.md の文字列が同じ・項目の集合が同じ・トークンの前後）が満たされたかも読んでいないから。
    review\299\ に実物が置かれて総監督が条件を確かめるか、レビュアーの事後の評価が「届いた」とすれば「検証済み」にする
  - >-
    2026-10-24 に review\299\ を読んだ（reply-architect-20261024-20.md）。harness.progress の CLI では等価。
    しかし git show <ref>:docs/progress.yaml を直に読む 8 か所（goal_distance・hline_report・hline_stopped・hline_queue・hline_ledger_entry など）が過去ログを読まず、
    条件 1（hline_stopped report の節が同じ）は満たされていない。ref から読む関数に寄せる PR の後に「検証済み」にする
  - >-
    2026-10-24 に review\300\ を読んだ（reply-architect-20261024-21.md）。8 か所がすべて progress.read_ref を通ることを総監督が逐語で確かめた。
    距離（R4 の前提タスク 78／80）は分ける前の report.md と同じ。これで「検証済み」にした。試験は作り方から等価になる形で、8 か所の道を通っていない（記録だけ）

- id: req.unconverged-capped
  title: 収束しないタスクが、試行を重ねてトークンを使い切らない
  achieved_when: >-
    同じ差分のときの打ち切りに加えて、1 件のタスクが使うトークンに上限があり、超えたら打ち切って記録を残す
  verify_by: [test:independent]
  status: 未達
  depends_on: []
  proposals:
  - 1 件のタスクのトークンの上限と、超えたときの打ち切り
  evidence:
  - report.md：410-s4-1-refactorer は 6 回の試行で 6,794,108 トークン、501-b7-5 は 4 回で 4,406,437 トークン
  - 同じ差分で打ち切る守りは今もある（W-14・W-73）

- id: req.no-human-relay
  title: 人がファイルを運ばずに、プランナーとレビュアーが PR の実物を読める
  achieved_when: >-
    main と、開いている PR の枝の写しが、総監督とレビュアーの読める場所に機械で置かれる。受信箱の review\ へ人が運ぶ手番が要らない
  verify_by: [test:independent]
  status: 自己検証のみ
  depends_on: []
  tasks: [W-150]
  evidence:
  - PR #291（W-150）はマージ済み（副操縦士の知らせ）。枝の写し（13 本目で頼んだ受入 4）が入ったかは総監督は未確認
  - README P10：7 時間で 19 通を人が運んだ

# ---- ハーネスが健全：計画と役 ----

- id: req.planner-tools
  title: プランナー（総監督）が、自分で読み、調べ、知識を残して木を直していける
  achieved_when: >-
    総監督が受信箱から、main と枝を逐語で読め、外の情報の問いを出して出典の照合された記録を受け取れ、知識を Git に残せる
