  verify_by: [reviewer, human]
  status: 未達
  depends_on: []
  tasks: [W-155, W-156]
  evidence:
  - README P8・P9
  - 16 本目 §3 の役の対応

- id: req.ledger-triaged
  title: 台帳の未完了のタスクが、木の要件に付くか、取り下げられている
  achieved_when: >-
    台帳の pending・in_progress・stopped のタスクがそれぞれ、木のどれかの要件の tasks にあるか、withdrawn になっている。
    取り下げは操縦士が確かめている
