    台帳の側（harness/progress.py）は次のとおりに置き換え、W-153 の受入に書く：
    (a) rebuild-0〜6 の節を消し、その下のタスクの group は節 rebuild 1 つにする（構造は木が持ち、台帳に写さない）。
