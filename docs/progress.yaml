- id: W-88
  title: 段の走らせ役（凍結の 10 本を工廠で 1 回ずつ、1 命令で順に回し、止まっても記録から続きを再開する）
  group: W-17
  target_repo: game-harness
  status: completed
  slug: 'bench: run-stage'
  serves: R4
  purpose: 工廠の 10 走行は最大 30 時間かかる。走行ごとに操縦士が命令を打つと、人が前の走行の終わりを待って張り付き、夜に止まれば朝まで何も走らない。1 命令で 10 本を回し、止まっても同じ命令で続きから再開できるようにする（基準の走行 W-89 と非劣性の検査 W-57 が使う。D-106 改訂 1・D-109）
  deliverable: harness/bench_run.py の stage、tests/test_bench_run_stage.py
  depends_on:
  - W-46
  acceptance:
  - python -m harness.bench_run stage --tag <t> --repo <clone> --base <rev> は、凍結の 10 本を課題の ID の順に 1 本ずつ工廠の走らせ役（factory）で走らせる。run-id は <t>-<回>。invalid でない記録か、finish を待つ走行のディレクトリがある課題は飛ばす（止まった段を同じ命令で再開できる）。python -m harness.bench_run stage --tag <t> --finish は、操縦士のアカウントで、finish を待つすべての走行に finish を掛ける
  - 無効の走行は次の回の run-id で走らせ直し、同じ課題で 3 回続けて無効なら、止めて終了コード 1 で理由を出す（REQ-22・REQ-24）。10 走行がそろえば 0 で終わる
  - 走っている間は OS の眠りを止める（Windows の SetThreadExecutionState）
  oracle:
  - path: tests/test_bench_run_stage.py
    from: self
  verification:
    command: python -m unittest tests.test_bench_run_stage
    expected_exit_code: 0
