  slug: 'bench: blind-oracle-and-chat-baseline'
  by: pilot
  depends_on:
  - W-22
  acceptance:
  - 非公開オラクル：課題 10 本（B01〜B10）の判定役をリポジトリの外に置き、main には各判定役の指紋（sha256）だけを置く。工廠の実装役・計画役とチャット型は判定役を読めない（道具の禁止で拒まれる）。判定役の中身が走行の差分・記録に現れた走行は無効にする
  - 床：10 本すべてで、参照実装が非公開オラクルを満点で通り、空実装の通過率が 0.2 未満
  - 比較の測定：10 本すべてで、工廠（W-24 と同じ条件：計画役が仕様から What を起草）とチャット型（同じモデル・単発のセッション）を、同じ課題・同じ土台のコミットで各 1 回以上走らせ、課題と条件ごとに、成功率（非公開オラクルの通過率）・トークン消費・試行回数（工廠は What の試行の合計、チャット型は呼び出しの回数とターン数）を記録として main に置く
  - 天井：チャット型の平均の通過率が 0.85 以下で、満点でない課題が 3 本以上（DR-005 §決定 4）。満たすまで課題を作り直し、満たした時点で課題・判定役・閾値を凍結する
