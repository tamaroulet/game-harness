  group: rebuild
  target_repo: game-harness
  status: pending
  slug: 'rebuild: protect-archive-read'
  by: executor
  purpose: 現役の台帳に archive 宣言を置き、過去ログが読めないときに黙って現役だけを返さず例外（ProgressError）を出す（フェイルクローズド）
  deliverable: harness/progress.py の改修・tests/test_archive_guard.py・台帳と木の更新
  depends_on:
  - W-153
  acceptance:
  - python -m unittest tests.test_archive_guard が通り、受入の試験をすべて含む
  - 台帳に archive が宣言されているとき、過去ログが読めなければ ProgressError を送出し、黙って現役だけの台帳を返さない
  - 偽の git show が 2 つのファイルを返したとき、read_ref（および hline_queue.read_ledger 等）が済みのタスクを含む
  - archive 宣言が無い古い ref の台帳を読むときは既存の挙動を維持する（後方互換）
  oracle:
  - path: tests/test_archive_guard.py
    from: director
  verification:
    command: python -m unittest tests.test_archive_guard
    expected_exit_code: 0
