  - python -m harness.bench_verify (--task <id>... | --all) --min-runs <n> [--frozen] は、floor.json が合格で指紋が今と同じ・factory の有効な記録が n 件以上・各記録の head を採点し直すと passed と tests が一致、のときだけ 0
  - factory の記録は、キューの What の sha256 がすべて計画役の出力にあり、置き直しが 0 のときだけ有効（人の介入 0 回の測り方）。--frozen は、freeze.json の base・指紋に合い、凍結の時刻より後に始まった記録だけを数える
  - --package <dir> と --oracles <dir> を渡すと、展開した走行の束の manifest.json の sha256 を照合し、git の bundle の先端を渡したオラクルで採点し直し、記録の score と一致することを確かめ、すべて一致すれば 0（REQ-36）
  oracle:
