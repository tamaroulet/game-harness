  depends_on:
  - W-41
  - W-44
  - W-68
  - W-71
  acceptance:
  - python -m harness.bench_run factory --task <id> --run-id <r> --repo <clone> --base <rev> は、制限のアカウントで、監修つきの計画（W-43）・開始のコミット・走行ごとの受信箱と設定（open_pr false・統合ブランチ bench/<id>/factory-<r>）で clone の H ラインを、待ちと処理中が 0 になるか 3 時間まで回し、走行のディレクトリを書く。python -m harness.bench_run finish --task <id> --run-id <r> --repo <clone> は、操縦士のアカウントで、そのディレクトリに漏れの走査（REQ-11）と枝の先端の採点（REQ-18）を掛けて記録を書く
  - 記録に、計画役の出力の sha256・キューが取り込んだ What の sha256・置き直しの数・What の試行の合計・監修の差し戻しの回数・トークン・利用枠の回復待ちの秒が入る。計画が確定しなかった走行は、score が 0 の有効な走行として理由が入る（REQ-23）。3 時間は利用枠の回復待ちを除いて数える（REQ-17）
  - 走行ごとに REQ-31 のディレクトリ（factory/ を含む）を書き、記録に manifest.json の sha256 を入れる
  - clone の poll は 1 回ずつ TTL つきの子プロセスで起こし、0 以外で終わっても次の poll を起こす。同じ終わり方（終了コードと標準エラーの最後の行）が 3 回続いたら、走らせ役の異常として invalid の記録に理由を書いて止める（REQ-22）
