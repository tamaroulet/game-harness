  text: 実装役のコンテナを Docker の内部のネットワークだけにつなぎ、許可リストのプロキシ（tinyproxy 1.11.0）を外への道にすると、許可した宛先だけに届き、直の接続と生の TCP はどこにも届かない。許可はモデルの API（agy の 3 つの宛先）だけにし、パッケージのレジストリ（PyPI・npm・crates.io・Go のプロキシとミラー）とコードの置き場（GitHub）は塞ぐ（境界の検査で、プロキシ越しにも直にも届かないことを走りの前ごとに確認する）。agy 1.5.3 は、root の持ち物で書き換えのできない ~/.gemini/config/hooks.json のフック（PreToolUse で、search_web・read_url_content・ブラウザ系などの Web の道具と、下位エージェントとワークフローの口を deny）を uid 1000 で読み込み、uid 1000 からはフックを書き換え・消し・移しできない。本物の agy 1.5.3 は、このフックで search_web と invoke_subagent を止めた（どちらもステップが DONE にならず ERROR で終わり、下位エージェントは作られなかった）
