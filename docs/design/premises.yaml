- id: P-022
  text: 1 つの会話を続ける形は、段ごとに新しい会話にする形より安く、前の段で通っていたテストを壊しにくい。SlopCodeBench の易・中・難の 3 問（etl_pipeline・file_query_tool・sith。gemini-4-hydrogen-medium）で、チェックポイントごとの新しい会話（H0_fresh）は、続く会話（H0）より、キャッシュしない入力が 2.00 倍（165.6 万 対 82.9 万）・出力が 1.75 倍・実装役の時間が 2.30 倍（5,380 秒 対 2,337 秒）で、前のチェックポイントで通っていたテストの真の退行は H0 0 件・H0_fresh 3 件だった。差は立ち上がりでなく、作業場のコードとテストを毎回読み直すステップの多さによる。旧モデル（gemini-3.8-flash-medium）の自作の 6 ステージの課題では、続く会話のキャッシュでない分（入力＋出力）67.7 万が、毎ステージの新しい会話の 136.8 万の約半分で、差の約半分が立ち上がりの冷え、残りがターンの多さだった
  kind: measured
