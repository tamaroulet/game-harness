  text: CaP-X（capgym/cap-x、コミット acac62f、MIT）の Robosuite と LIBERO-PRO の特権の系統は、Minimal のプロファイル（PyRoKi だけ・CPU だけ）と状態 API で、GPU も視覚のサーバーも無く、オフライン（ロボットの記述 482 MB の事前の取得 1 回の後は --network none）のまま、公式の正解で task_completed が成功し（Robosuite のキューブの持ち上げ 5/5 × 2・LIBERO-PRO の object_swap_7 3/3 × 2）、解答なしで 0。公式のままでは試行のシードが Robosuite の初期の配置に届かず、reset の頭で環境とサンプラの乱数を作り直す 2 行で、初期と最後の状態が小数 9 桁まで一致する。要約の success rate はコードが走った割合で、平均の報酬は何もしなくても 0.47〜0.50
