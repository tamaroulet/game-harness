- id: P-034
  text: LLM が仕様（イシューや課題の文）から作るテストは、正解の実装でも落ちるものを多く含み、修正前のコードでの落ち方（AssertionError か例外か）が妥当性を予測する。既存のコードに対して作る性質のテストの報告も、約半分は誤り。採点の仕組みが働いているかは、多くの試行の記録と採点の結果を読まないと分からない。そのため、機械で走る受け入れの検査は、実装の前に作るか後に作るかによらず、正しい実装のある所で誤検出を測ってから押し返しに使う
