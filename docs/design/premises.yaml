  kind: research
  basis: [R-20261023-m1-autonomous-dev-architecture#C13, R-20261023-m4-agent-execution-isolation#C10, R-20261023-c1-run-loop-on-ci-vs-local#C2, R-20261023-c1-run-loop-on-ci-vs-local#C7, R-20261023-c1-run-loop-on-ci-vs-local#C12]
  note: CI の上で長く多くのタスクを回した当事者の事後検証は見つからない（c1 の unknowns）。定額の契約のトークンで動く記述は照合が quote_not_found で、Max の OAuth で認証に失敗する未解決の報告がある（c1#C6、未照合）。試しの走行で確かめるまで、置き換えを決め切らない
