  text: フェーズ 1 の土俵は 2 本主軸の直列のリレー。第 1 走者が Multi-step SWE（Klavis-AI、MIT。69 題からメモリ・ネットワーク・速さの採点・穴で絞ったクリーンの 14 題。dev は種つきの無作為の 2 題で、残りの 12 題は未開封の held-out の候補。要綱 1〜4・7）、第 2 走者が CaP-X（capgym/cap-x、MIT。Robosuite と LIBERO-PRO の特権の系統を、CPU だけの Minimal と状態 API で。Robosuite のシードの 2 行の最小の穴塞ぎを当て、主指標は task_completed。要綱 5〜7）。S3a はベースラインを H0_continue とし、H0_continue・H_continue・H_handoff を対等に比べる（第 1 関門を先に、第 2 関門は S3b）。Multi-step SWE では protect を外し、消えたテストの項目を退行に数えない。実装役は非 root（uid 1000）で、課題ごとに正解を uid 1000 で当てる 0b を取ってから使う。実験単体の上限は run_tokens 1,200 万・run_seconds 172,800 で、利用枠は枯渇寸前の安全弁（週 5%・5 時間 10%）だけを見る。主指標は段の完答（公式の二値の報酬）で、連続の点・new_capability・inherited_regression・失敗の 5 分類を並べる。VibePrevisBench は撤退、BenchCAD は CaP-X が不適のときの要綱 5 の予備、RoadmapBench は凍結。SlopCodeBench と SWE-Game Mode 4 は Stage 1 の後に撤退した
