- id: P-037
  text: FeatureBench の開発用 15 課題で、第 1 関門（pyflakes の未定義の名・全モジュールの import・self の属性・絞らない既存のテスト）の検出の絶対の数は、正しい実装でも 13 課題で 0 にならない。最後に合格した状態との差で読むと（段 a では正解の状態を基準の代わりにした。比較条件の中ではこの読みを使わず、正解を使わない読み R0 にする。2026-11-17、v4 実験 §5-6）、記録の A のパッチの未解決 10 本のうち 7 本で検出が出て、7 本とも消された名か変えたファイルに当たり、解決 9 本のうち 4 本でも、残ったコードが呼ぶ名を戻していない本当の未完成を拾う。漏れた未解決の 3 本は、作った口の引数の扱いと不正な入力の拒み方（根拠のある 5 項目）と、課題の文に無いエラーの文言だけだった
  kind: measured
  basis: [docs/v4/experiments.md の §5-4（2026-11-14〜15、利用枠 0。再生ツールは harness/fb_replay.py と harness/fb_gate_probe.py、コミット 57cd5b1 と 1d2b769）]
  note: 正解の状態の検出は、ライブラリにもとからあるもの（動的な名前空間・任意の依存のスキップ）と、コンテナの環境で落ちるテスト（ネットワークを切ったこと・入っていない任意の依存・TeX・1 テスト 10 秒の上限）。FeatureBench は、実装を消した状態で落ちるテストを P2P から外すので、残った参照の壊れを解決に数える。A のパッチは同じモデルの 1 回ずつで、19 本のうち 14 本はホワイトボックスの実行の最後の状態。押し返しで解決が上がるかは測っていない（FeatureBench での段 c は見送り。P-038）
