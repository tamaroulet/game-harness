  text: 区切りで仕事を引き継ぐとき、文脈を持つ引き継ぎ（生の記録・要約・構造化のメモ）は、リポジトリだけの引き継ぎより後任の手間を減らす。続く会話は 1 ターンの中でキャッシュがよく当たり、ターンの境と圧縮の後で外れる。新しい文脈に入るエージェントは向き直りに時間を使う
