- id: P-038
  text: FeatureBench の開発用 15 課題で、正解を使わない第 1 関門の読み R0（静的な検出は t=0 に無かったものだけ、テストの落ちは環境の型の文言に当たらないもの、既存のテストの改変を押し返す。テストの段は 1 回 300 秒）は、記録の A のパッチの未解決 10 本のうち 7 本を、7 本ともテストの落ちで拾う。一方で正解の状態を 15 課題中 4 課題で押し返し、G0-3 の線（2 以下）に届かない。正解の押し返しは、静的な検出（2 課題）と、環境の欠け（API キー・パッケージの外の任意の依存）による落ちのうち、環境の型の文言に当たらないもの（mlflow の 3 課題）。静的な検出は未解決を 1 本も拾わない（t=0 がコードを消して壊れているので、戻し忘れの検出は t=0 との差で相殺される。段 a の正解との差では、未解決 7 本で静的な検出が出て、その 399 件はすべて t=0 にもあった）。正解を押し返した静的な検出は、属性（astropy の 1 件）とモジュールを実行して読む import（mlflow の 4 件）で、pyflakes（未定義の名・構文の誤り）で正解を押し返した課題は 15 のうち 0
  kind: measured
  basis: [docs/v4/experiments.md の §5-6 の G0-3 の結果（2026-11-17、利用枠 0。harness/fb_replay.py の r0・fill・recheck と harness/fb_gate_probe.py）]
  note: 段 a の記録（run3）に R0 を当てた再集計で、t=0 ではテストを走らせていない。実走で予定した、t=0 と同じ落ちを除く足しは、mlflow の 3 課題で参考に測り、当てても正解の押し返しは減らなかった。mlflow の 3 課題は、要約の行を読めるように直した probe で、正解と A の状態を測り直した。環境の型の一覧は run3 の正解の状態の落ちを見直してから書いたが、mlflow の要約の行が読めていなかったので、その落ちは見直しに入っていなかった
