- id: P-036
  text: 最前線の長く走る開発のハーネスは、実装の前に、何をもって完了とするかを確かめられる振る舞いで取り決め、実装の後に、書き手と文脈を共有しない評価役が、動くものを外から確かめる。評価役は放っておくと甘く、問題を見つけても通してしまい、較正しても深い所を見落とす。生成役に自分を厳しく見させるより、独立した評価役を厳しくするほうが扱いやすい
  kind: research
  basis: [R-20261114-harness-contract-evaluator#C1, R-20261114-harness-contract-evaluator#C2, R-20261114-harness-contract-evaluator#C3, R-20261114-harness-contract-evaluator#C4, R-20261114-harness-contract-evaluator#C5, R-20261114-harness-contract-evaluator#C6, R-20261114-harness-contract-evaluator#C7, R-20261113-v4-harness-principles#C25]
  note: Anthropic の 1 つの開発の記録（評価役あり・なしの数の比べは無い）と、Cognition の実務の記事。テストのコードを実装の前に書く記述は無い。手元では、評価役の頼みの較正（憲章 §5 で効きに数えない）でなく、合否を、候補の実装を見る前に固めた機械の確かめの結果で決めることで、甘さに手当てする（設計 §4-2）
