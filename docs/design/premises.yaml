- id: P-034
  text: LLM が仕様（イシューや課題の文）から作るテストは、正解の実装でも落ちるものを多く含み、修正前のコードでの落ち方（AssertionError か例外か）が妥当性を予測する。既存のコードに対して作る性質のテストの報告も、約半分は誤り。採点の仕組みが働いているかは、多くの試行の記録と採点の結果を読まないと分からない。そのため、機械で走る受け入れの確かめは、実装の前に作るか後に作るかによらず、正しい実装のある所で誤検出を測ってから押し返しに使う
  kind: research
  basis: [R-20261114-e1-acceptance-and-handoff#C2, R-20261114-e1-acceptance-and-handoff#C4, R-20261114-e1-acceptance-and-handoff#C7, R-20261023-m2-verification-of-agent-changes#C6]
  note: SWT-Bench の pass@5 で、修正前に落ちるテストを作れた課題 62.7%・正解の後で通るテストを作れた課題 22.1%（直す前に落ちたテストのうち正解でも落ちたものが課題の約 4 割。落ちの理由は記録で未確認）。Otter の表 6 で、AssertionError で落ちたテストの 57.1%・例外で落ちたテストの 3.7% が fail-to-pass。Agentic PBT の報告の 56% が有効。どれも既存のコードの課題の数。2026-11-14 に、実装の前に課題の文からテストを作る形（前の版の E-1）を取り下げた後も、出口の第 2 関門の確かめに同じ筋を当てる（設計 §4-2、E-1 の段 b）
  checked_at: 2026-11-14
  recheck_by: 2026-12-14
  used_by: [v4 設計 §2-8, v4 設計 §4-2, v4 設計 §8, v4 実験 §5]
