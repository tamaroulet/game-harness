  text: 3 段の形（上流で、人の受け入れの基準から検証できる形の要件の台帳を作る・中流で、1 つの仕事を 1 つの会話で走り切らせ、出口でトークン 0 の機械の検査（参照の完全さ・絞らないテスト・守るテストの不変。最後に合格した状態との差で読む）と、外からの実行検証と不変条件・性質の検査（実装役から独立に作って固め、区切りの出口で 1 回だけ作る）で押し返し、積み重ねでは合格した検査を非退行の関門に積み、段をまたぐ文脈の持ち方は測って決める・外側で、失敗の型の台帳から直し続ける）は、仕様の読み飛ばし・作った範囲だけで確認して終える早合点・参照の崩れ・退行・動かして初めて出る破綻を減らし、その上乗せの費用は手戻りの費用より小さい。この効きは、細かいリセットに依らない
