- id: P-032
  text: ベンチの検証用のモデルは Gemini 4 Hydrogen（medium）を標準にし（X-01 の 1 課題目の燃費で決めた）、3.8 Flash は少数の課題で比べる候補にする。FeatureBench の課題は Fast（v1.1）から取り、4 つの像（seaborn・mlflow・pandas・astropy）を中心に、大きい層は全部の像から取る（P-033）。正解のテストを見せる白箱での比べはやめ、X-02 は段 1 の A の 4 課題で止めた。E-1 では、正解の実装と公式のテストを、実装役と検証役に見せずに、採点と、出口の 2 つの関門の誤検出の測りだけに使う。X-02 の前に分けた held-out の 14 課題は、封をしたまま E-1（出口の関門）の証明に回す
  kind: decision
  basis: [操縦士の裁定（2026-11-14、整理の PR の前の指示と、0-a の後の指示と、X-01 の 5 課題の後と白箱の校正の後の指示と、監査の後の決め）]
  note: 2026-11-14 の X-01 の 1 課題目で、Hydrogen の週の目盛りの減りは 2 ポイント未満だったので、数の線により標準にした。Hydrogen は agy 1.5.3 の Gemini Models の週の枠で動き、Argon と Claude の枠を使わない。FeatureBench の通常の実行が F2P のテストのファイルを消して隠すことは、featurebench/infer/runtime.py（コミット 08b25d9）で確かめた。白箱をやめた理由は、白箱の F2P のテストが正解の実装から作られたもので、実戦の受け入れの検証の事前の提示とは別物だから（監査、2026-11-14。設計 §4-2）。公式の API の値段（R-20261114-gemini-api-pricing。燃費の換算に使う）では、Hydrogen の入力と出力の単価は 3.8 Flash の 2026 年の値段の 2 倍で、2027-01-01 からの Flash の値段と同じ
