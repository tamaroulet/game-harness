  note: SWT-Bench の pass@5 で、修正前に落ちるテストを作れた課題 62.7%・正解の後で通るテストを作れた課題 22.1%（直す前に落ちたテストのうち正解でも落ちたものが課題の約 4 割。落ちの理由は記録で未確認）。Otter の表 6 で、AssertionError で落ちたテストの 57.1%・例外で落ちたテストの 3.7% が fail-to-pass。Agentic PBT の報告の 56% が有効。どれも既存のコードの課題の数。この筋で、2026-11-14 に実装の前に課題の文からテストを作る形（前の版の E-1）を取り下げ、2026-11-26 に、仕様だけから細かい単体テストを作る第 2 関門をやめて、外からの実行検証と不変条件・性質の検査にした。その検査も、正しい実装での誤った押し返しを測ってから押し返しに使う（設計 §4-2）
