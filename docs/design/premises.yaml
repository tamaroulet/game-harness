  text: FeatureBench の Lite（v1.1）は、30 課題のうち 19 課題が課題の設定で GPU を求め、手元の Docker（NVIDIA の container toolkit なし）では始まらない。Fast（v1.1）の 100 課題は GPU を求めず、手元で正解のパッチが通る
