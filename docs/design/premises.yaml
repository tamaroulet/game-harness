  text: ベンチの検証用のモデルは Gemini 4 Hydrogen（medium）を標準にし（X-01 の 1 課題目の燃費で決めた）、3.8 Flash は少数の課題で比べる候補にする。FeatureBench の課題は Fast（v1.1）から取り、4 つのイメージ（seaborn・mlflow・pandas・astropy）を中心に、大きい層は全部のイメージから取る（P-033）。正解のテストを見せるホワイトボックスでの比べはやめ、X-02 は段 1 の A の 4 課題で止めた。E-1 では、正解の実装と公式のテストを、実装役と検証役に見せずに、採点と、出口の 2 つの関門の誤検出の測りだけに使う。X-02 の前に分けた held-out の 14 課題は、E-1 の段 c を見送ったので、封を開けずに終える（操縦士の決め、2026-11-17）
