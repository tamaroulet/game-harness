name: harness-tests

# ハーネスの試験の全件と、前提の台帳・モデルの固定の検査。
# test：windows-latest（ハーネスが実際に動く土台）。test-linux：同じものを ubuntu-latest でも通す。
#   Windows にしか無い振る舞いを確かめる試験は、Windows のときだけ走る形にしてある。ジョブは別々に走る（どちらかの失敗がもう一方を止めない）。
# self-hosted runner は使わない（PC が止まっていてもチェックが回るように）。
# 前提の台帳は --strict で見る。確かめ直す期限（recheck_by）を過ぎた前提があると落ちるので、期限が来たら照らし直すか退けるかを決める。

on:
  push:
    branches: [main]
  pull_request:

# 同じ PR・同じブランチの古い走行は、新しい push で取り消す（承認も push で失効するので、古い結果は使われない）
concurrency:
  group: harness-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: dependencies
        run: python -m pip install -r requirements.lock

      - name: unittest
        run: python -m unittest discover -s tests

      - name: premises
        run: python -m harness.premises check --strict

      - name: model pin
        run: python -m harness.model_pin

  test-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: dependencies
        run: python -m pip install -r requirements.lock

      - name: unittest
        run: python -m unittest discover -s tests

      - name: premises
        run: python -m harness.premises check --strict

      - name: model pin
        run: python -m harness.model_pin
