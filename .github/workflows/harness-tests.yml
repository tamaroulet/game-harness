name: harness-tests

# 繧ｹ繧ｱ繧ｸ繝･繝ｼ繝ｩ縺ｮ迥ｶ諷矩・遘ｻ繝・せ繝医Ｈit 縺ｯ譛ｬ迚ｩ縲；itHub 縺ｯ蛛ｽ迚ｩ縲∝ｭ舌・繝ｭ繧ｻ繧ｹ縺ｯ繧ｹ繧ｿ繝悶・# taskkill 縺ｨ Windows 縺ｮ繝代せ繧剃ｽｿ縺・・縺ｧ windows-latest・・itHub-hosted・峨〒襍ｰ繧峨○繧九・# self-hosted runner 縺ｯ菴ｿ繧上↑縺・ｼ・C 縺梧ｭ｢縺ｾ縺｣縺ｦ縺・※繧ゅメ繧ｧ繝・け縺悟屓繧九ｈ縺・↓・峨・
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # harness/progress.py 縺・docs/progress.yaml 繧定ｪｭ繧・・DR-003 ﾂｧ4・峨よ焔蜈・→蜷後§迚医↓蝗ｺ螳壹☆繧・      - name: dependencies
        run: python -m pip install pyyaml==6.0.3 mujoco==3.15.0

      # runner 繧ｳ繝ｳ繝・く繧ｹ繝医・繧ｸ繝ｧ繝門腰菴阪・ env 縺ｧ縺ｯ菴ｿ縺医↑縺・ｼ医Ρ繝ｼ繧ｯ繝輔Ο繝ｼ縺斐→襍ｷ蜍輔＠縺ｪ縺九▲縺溘ょｮ滓ｸｬ・・      - name: unittest
        env:
          HARNESS_SELFTEST_DIR: ${{ runner.temp }}\harness-selftest
        run: python -m unittest discover -s tests -v
