name: harness-tests

# スケジューラの状態遷移テスト。git は本物、GitHub は偽物、子プロセスはスタブ。
# taskkill と Windows のパスを使うので windows-latest（GitHub-hosted）で走らせる。
# self-hosted runner は使わない（PC が止まっていてもチェックが回るように）。
#
# 全件は harness.fastsuite でモジュールごとに別のプロセスで並列に走らせる（Gate 1 と同じ道具）。
# 並列で落ちたモジュールは単独で 1 回走らせ直し、通れば flaky として本文に出す（終了コードには効かない）。

on:
  push:
    branches: [main]
  pull_request:

# 同じ PR・同じブランチの古い走行は、新しい push で取り消す（承認も push で失効するので、古い結果は使われない）
concurrency:
  group: harness-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/harness-tests.yml

      # harness/progress.py が docs/progress.yaml を読む（ADR-003 §4）。手元と同じ版に固定する
      - name: dependencies
        run: python -m pip install pyyaml==6.0.3 mujoco==3.15.0

      # dotnet build を呼ぶテスト（invgen・invrun・query・struct_literal・testgen）が、初めての NuGet パッケージを
      # 並列に同時に展開すると、グローバルのパッケージのフォルダで書き込みが競合する（NU5037。PR #165 の実測）。
      # 並列の前に 1 回だけ restore し、テストからは読むだけにする。パッケージと版は config/invgen.json と同じ
      - name: nuget warm-up
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'nuget-warmup'
          New-Item -ItemType Directory -Force $d | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.8.0" />
              <PackageReference Include="NUnit" Version="3.14.0" />
              <PackageReference Include="NUnit3TestAdapter" Version="4.5.0" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $d 'Warmup.csproj')
          dotnet restore (Join-Path $d 'Warmup.csproj')

      # runner コンテキストはジョブ単位の env では使えない（ワークフローごと起動しなかった。実測）
      - name: unittest
        env:
          HARNESS_SELFTEST_DIR: ${{ runner.temp }}\harness-selftest
        run: python -m harness.fastsuite discover -s tests
