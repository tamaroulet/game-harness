name: probe-linux

# 探り（2026-10-30、操縦士の許し）：ハーネスの全件の試験を Linux で 1 回流し、落ちる数を数える。
# この枝にだけ置く。main には入れない。結果は suite.log を成果物に残す。

on:
  push:
    branches: [probe/linux-ci]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: dependencies
        run: python -m pip install -r requirements.lock

      - name: nuget warm-up
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'nuget-warmup'
          python -m harness.toolchain warmup $d
          dotnet restore (Join-Path $d 'Warmup.csproj')

      - name: unittest
        env:
          HARNESS_SELFTEST_DIR: ${{ runner.temp }}/harness-selftest
        run: |
          set -o pipefail
          python -m harness.fastsuite discover -s tests 2>&1 | tee suite.log

      - name: keep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: suite.log

  # 探り 2（2026-10-30、v3 の計画の線 2 の E1）：agy と Claude Code が Linux に入るかだけを見る。認証はしない
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: install agy (official script)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install claude code (official script)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: versions
        run: |
          agy --version || echo "agy_version_failed"
          agy --help 2>&1 | head -40 || true
          claude --version || echo "claude_version_failed"
          python3 -c "import platform; print(platform.platform())"
          ldd --version | head -1
